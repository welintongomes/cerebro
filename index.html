<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Segundo Cérebro</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%224%22 fill=%22%231B2420%22/><circle cx=%2212%22 cy=%2212%22 r=%225%22 fill=%22%23D3A24E%22/></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

:root{
  --bg:#EDF0E7;
  --paper:#FFFFFF;
  --ink:#20281F;
  --ink-soft:#5B6754;
  --line:#D9DACB;
  --accent:#A97C34;
  --accent-ink:#2B2109;
  --rail-bg:#1B2420;
  --rail-text:#E3E7DC;
  --rail-text-dim:#7C8B77;
  --danger:#9B4234;
  --radius:3px;
  --serif:'Fraunces', Georgia, serif;
  --sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}
[data-theme="dark"]{
  --bg:#14180F;
  --paper:#1C221A;
  --ink:#E7ECE1;
  --ink-soft:#93A08C;
  --line:#333B2E;
  --accent:#D3A24E;
  --accent-ink:#1B140A;
  --rail-bg:#0D110C;
  --rail-text:#E3E7DC;
  --rail-text-dim:#5C6A57;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; margin:0 0 .35em; color:var(--ink);}
p{margin:.3em 0;}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
input,textarea,select{font-family:inherit; font-size:1rem; color:var(--ink);}
.icon{fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; display:block; flex-shrink:0;}

#app{min-height:100vh; display:flex;}
.sidebar{display:none;}
main#main-content{flex:1; min-width:0; padding:1.25rem 1.1rem 6rem; max-width:760px; margin:0 auto; width:100%;}

.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:1.1rem; gap:.75rem; flex-wrap:wrap;}
.topbar h1{font-size:1.5rem; margin:0;}

.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; height:64px;
  background:var(--rail-bg); color:var(--rail-text-dim);
  display:flex; z-index:20; padding-bottom:env(safe-area-inset-bottom,0);
}
.bottom-nav button{
  flex:1; background:none; border:none; color:inherit;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  font-size:.68rem; padding:.4rem 0;
}
.bottom-nav button.active{color:var(--rail-text);}

.fab{
  position:fixed; right:1.1rem; bottom:80px; width:52px; height:52px; border-radius:50%;
  background:var(--accent); color:var(--accent-ink); border:none; z-index:21;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,.28);
}

.card{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
  padding:.85rem 1rem; margin-bottom:.65rem; border-left:3px solid var(--cat-color, var(--line));
}
.card.clickable{cursor:pointer;}
.card h3{font-size:1.02rem; margin:0 0 .15rem; display:flex; align-items:center; gap:.3rem;}
.card .meta{font-size:.76rem; color:var(--ink-soft); display:flex; gap:.55rem; flex-wrap:wrap; margin-top:.3rem;}
.card .snippet{color:var(--ink-soft); font-size:.88rem; margin:.3rem 0 0;}
.tag{display:inline-block; padding:.08rem .5rem; border:1px solid var(--line); border-radius:2px; font-size:.7rem; color:var(--ink-soft);}

.btn{background:var(--paper); border:1px solid var(--line); color:var(--ink); padding:.55rem .9rem; border-radius:var(--radius); font-size:.88rem; display:inline-flex; align-items:center; gap:.35rem;}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600;}
.btn-danger{border-color:var(--danger); color:var(--danger);}
.btn-text{background:none; border:none; color:var(--ink-soft); padding:.3rem .1rem; display:inline-flex; align-items:center; gap:.2rem;}
.btn-block{width:100%; justify-content:center;}

.field{margin-bottom:1.1rem;}
.field label{display:block; font-size:.8rem; color:var(--ink-soft); margin-bottom:.3rem;}
.field input[type=text],.field input[type=search],.field textarea,.field select{
  width:100%; padding:.6rem .7rem; border:1px solid var(--line); border-radius:var(--radius);
  background:var(--paper); color:var(--ink);
}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--accent); outline-offset:1px;}
.field textarea{min-height:170px; font-family:var(--serif); font-size:1.04rem; line-height:1.65; resize:vertical;}

.chip-row{display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:1.1rem;}
.chip{padding:.3rem .7rem; border:1px solid var(--line); border-radius:20px; font-size:.8rem; background:var(--paper); color:var(--ink-soft);}
.chip.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}

.empty{text-align:center; padding:3rem 1rem; color:var(--ink-soft);}
.empty h2{color:var(--ink); font-size:1.2rem;}

.wikilink{color:var(--accent); text-decoration:underline; text-underline-offset:2px;}
.note-content{font-family:var(--serif); font-size:1.06rem; line-height:1.75;}
.note-content code{background:var(--bg); padding:.1rem .3rem; border-radius:2px; font-size:.88em; font-family:monospace;}
.note-content ul{padding-left:1.2rem;}

.backlinks{margin-top:1.5rem; padding-top:1rem; border-top:1px solid var(--line);}
.backlinks h4{font-size:.82rem; color:var(--ink-soft); font-weight:500; margin-bottom:.5rem;}

.modal-overlay{position:fixed; inset:0; background:rgba(10,12,8,.45); display:flex; align-items:flex-end; justify-content:center; z-index:30;}
.modal{background:var(--paper); width:100%; max-width:620px; border-radius:10px 10px 0 0; padding:1.2rem; max-height:88vh; overflow-y:auto;}

.stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; margin-bottom:1.4rem;}
.stat{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:.85rem;}
.stat .num{font-family:var(--serif); font-size:1.65rem; display:block; line-height:1.1;}
.stat .label{font-size:.76rem; color:var(--ink-soft);}

.flash-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:2rem 1.2rem; text-align:center; margin-bottom:1.2rem;}
.flash-card .front{font-family:var(--serif); font-size:1.35rem;}
.flash-card .back{font-family:var(--serif); font-size:1.1rem; margin-top:1rem; padding-top:1rem; border-top:1px dashed var(--line); color:var(--ink); text-align:left;}
.review-actions{display:grid; grid-template-columns:repeat(4,1fr); gap:.45rem;}
.review-actions button{padding:.65rem .2rem; font-size:.76rem; justify-content:center;}
.review-progress{color:var(--ink-soft); font-size:.82rem; margin-bottom:.6rem;}

.switch{position:relative; width:42px; height:23px; display:inline-block; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0; position:absolute;}
.switch .slider{position:absolute; inset:0; background:var(--line); border-radius:24px; transition:.15s;}
.switch .slider:before{content:''; position:absolute; width:17px; height:17px; left:3px; top:3px; background:var(--paper); border-radius:50%; transition:.15s;}
.switch input:checked + .slider{background:var(--accent);}
.switch input:checked + .slider:before{transform:translateX(19px);}
.theme-row{display:flex; align-items:center; gap:.6rem; font-size:.9rem;}

.danger-zone{border:1px solid var(--danger); border-radius:var(--radius); padding:1rem; margin-top:2rem;}
.danger-zone h3{color:var(--danger); font-size:1rem;}
.hint{color:var(--ink-soft); font-size:.86rem;}

@media (min-width: 860px){
  .bottom-nav,.fab{display:none;}
  .sidebar{
    display:flex; flex-direction:column; width:230px; flex-shrink:0;
    background:var(--rail-bg); color:var(--rail-text-dim); padding:1.6rem 1rem;
    position:sticky; top:0; height:100vh;
  }
  .sidebar .brand{font-family:var(--serif); color:var(--rail-text); font-size:1.35rem; line-height:1.2; margin-bottom:2rem;}
  .nav-rail{display:flex; flex-direction:column; gap:.2rem; flex:1;}
  .nav-rail button{display:flex; align-items:center; gap:.7rem; background:none; border:none; color:inherit; padding:.6rem .65rem; border-radius:var(--radius); text-align:left; font-size:.92rem;}
  .nav-rail button.active{background:rgba(255,255,255,.09); color:var(--rail-text);}
  .fab-inline{margin-top:1rem; background:var(--accent); color:var(--accent-ink); border:none; padding:.6rem; border-radius:var(--radius); font-weight:600; display:flex; align-items:center; justify-content:center; gap:.4rem;}
  main#main-content{padding:2.2rem 3rem 3rem; max-width:800px;}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- ícones (SVG mínimos, sem emojis) ---------- */
const ICONS = {
  home: '<rect x="4" y="4" width="16" height="16" rx="1"></rect><line x1="7" y1="9" x2="17" y2="9"></line><line x1="7" y1="13" x2="13" y2="13"></line>',
  notes: '<rect x="4" y="7" width="14" height="13" rx="1"></rect><rect x="7" y="4" width="14" height="13" rx="1"></rect>',
  search: '<circle cx="10" cy="10" r="6"></circle><line x1="14.5" y1="14.5" x2="19.5" y2="19.5"></line>',
  review: '<path d="M4 12a8 8 0 0 1 13.9-5.4"></path><polyline points="18 3 18 7 14 7"></polyline><path d="M20 12a8 8 0 0 1-13.9 5.4"></path><polyline points="6 21 6 17 10 17"></polyline>',
  settings: '<line x1="4" y1="6" x2="20" y2="6"></line><circle cx="14" cy="6" r="2"></circle><line x1="4" y1="12" x2="20" y2="12"></line><circle cx="9" cy="12" r="2"></circle><line x1="4" y1="18" x2="20" y2="18"></line><circle cx="16" cy="18" r="2"></circle>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>',
  close: '<line x1="6" y1="6" x2="18" y2="18"></line><line x1="6" y1="18" x2="18" y2="6"></line>',
  pin: '<circle cx="12" cy="12" r="5"></circle>',
  chevronLeft: '<polyline points="15 18 9 12 15 6"></polyline>'
};
function icon(name, size){
  size = size || 18;
  return '<svg viewBox="0 0 24 24" width="'+size+'" height="'+size+'" class="icon">'+(ICONS[name]||'')+'</svg>';
}

/* ---------- estado ---------- */
let db;
let notesCache = [];
let settings = { theme:'light', fontSize:'md' };
let currentRoute = 'inicio';
let currentNoteId = null;
let notesFilter = { category:null };
let lastQuery = '';
let reviewQueue = [];
let reviewIndex = 0;
let reviewRevealed = false;

/* ---------- IndexedDB ---------- */
const DB_NAME = 'segundoCerebroDB';
const DB_VERSION = 1;

function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const database = e.target.result;
      if(!database.objectStoreNames.contains('notes')){
        const store = database.createObjectStore('notes', { keyPath:'id', autoIncrement:true });
        store.createIndex('category','category');
        store.createIndex('updatedAt','updatedAt');
        store.createIndex('dueDate','dueDate');
      }
      if(!database.objectStoreNames.contains('meta')){
        database.createObjectStore('meta', { keyPath:'key' });
      }
    };
    req.onsuccess = (e)=>{ db = e.target.result; resolve(db); };
    req.onerror = (e)=> reject(e.target.error);
  });
}
function addNote(note){
  return new Promise((resolve, reject)=>{
    const req = db.transaction('notes','readwrite').objectStore('notes').add(note);
    req.onsuccess = ()=>{ note.id = req.result; resolve(note); };
    req.onerror = ()=> reject(req.error);
  });
}
function putNote(note){
  return new Promise((resolve, reject)=>{
    const req = db.transaction('notes','readwrite').objectStore('notes').put(note);
    req.onsuccess = ()=> resolve(note);
    req.onerror = ()=> reject(req.error);
  });
}
function deleteNoteDB(id){
  return new Promise((resolve, reject)=>{
    const req = db.transaction('notes','readwrite').objectStore('notes').delete(id);
    req.onsuccess = ()=> resolve();
    req.onerror = ()=> reject(req.error);
  });
}
function getAllNotesDB(){
  return new Promise((resolve, reject)=>{
    const req = db.transaction('notes','readonly').objectStore('notes').getAll();
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
function getMeta(key){
  return new Promise((resolve, reject)=>{
    const req = db.transaction('meta','readonly').objectStore('meta').get(key);
    req.onsuccess = ()=> resolve(req.result ? req.result.value : null);
    req.onerror = ()=> reject(req.error);
  });
}
function setMeta(key, value){
  return new Promise((resolve, reject)=>{
    const req = db.transaction('meta','readwrite').objectStore('meta').put({ key, value });
    req.onsuccess = ()=> resolve();
    req.onerror = ()=> reject(req.error);
  });
}
function wipeAllDB(){
  return new Promise((resolve, reject)=>{
    const t = db.transaction('notes','readwrite');
    t.objectStore('notes').clear();
    t.oncomplete = ()=> resolve();
    t.onerror = ()=> reject(t.error);
  });
}

/* ---------- utilidades ---------- */
function main(){ return document.getElementById('main-content'); }
function escapeHTML(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function debounce(fn, ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(null,a), ms); }; }
function fmtDate(d){ return d.toISOString().slice(0,10); }
function relativeDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const diffDays = Math.floor((now - d) / 86400000);
  if(diffDays <= 0) return 'hoje';
  if(diffDays === 1) return 'ontem';
  if(diffDays < 7) return 'há ' + diffDays + ' dias';
  return d.toLocaleDateString('pt-BR');
}
function snippet(text){
  if(!text) return '';
  const clean = text.replace(/\[\[(.+?)\]\]/g,'$1').replace(/[*_`#]/g,'').replace(/\n+/g,' ').trim();
  return clean.length > 120 ? clean.slice(0,120) + '…' : clean;
}
const CATEGORY_PALETTE = ['#B8873B','#3C7A73','#6B4E71','#A24E3C','#5B7B4D','#4A5568','#7A5C3E'];
function colorForCategory(cat){
  if(!cat) return '#8A8F82';
  let hash = 0;
  for(let i=0; i<cat.length; i++) hash = (hash * 31 + cat.charCodeAt(i)) >>> 0;
  return CATEGORY_PALETTE[hash % CATEGORY_PALETTE.length];
}
function renderContent(text){
  let s = escapeHTML(text);
  s = s.replace(/\[\[(.+?)\]\]/g, (m,p1)=> '<a href="#" class="wikilink" data-title="'+p1.replace(/"/g,'&quot;')+'">'+p1+'</a>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/_(.+?)_/g, '<em>$1</em>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  const lines = s.split('\n').map(line=>{
    if(/^- /.test(line)) return '<li>'+line.slice(2)+'</li>';
    return line;
  });
  s = lines.join('\n');
  s = s.replace(/(<li>.*?<\/li>(\n)?)+/gs, m => '<ul>' + m.replace(/\n/g,'') + '</ul>');
  s = s.replace(/\n/g, '<br>');
  return s;
}
function searchNotes(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const scored = notesCache.map(n=>{
    let score = 0;
    const title = (n.title||'').toLowerCase();
    const content = (n.content||'').toLowerCase();
    const tags = (n.tags||[]).join(' ').toLowerCase();
    if(title === q) score += 100;
    else if(title.startsWith(q)) score += 40;
    else if(title.includes(q)) score += 20;
    if(tags.includes(q)) score += 15;
    if(content.includes(q)) score += 8;
    return { note:n, score };
  });
  return scored.filter(r=>r.score>0).sort((a,b)=>b.score-a.score).map(r=>r.note);
}
function pickNoteOfDay(){
  if(notesCache.length === 0) return null;
  const d = fmtDate(new Date());
  let hash = 0;
  for(let i=0;i<d.length;i++) hash = (hash*31 + d.charCodeAt(i)) >>> 0;
  return notesCache[hash % notesCache.length];
}
function scheduleReview(note, quality){
  let interval = (note.srs && note.srs.interval) || 0;
  let ease = (note.srs && note.srs.ease) || 2.5;
  let reps = (note.srs && note.srs.reps) || 0;
  if(quality === 0){
    reps = 0; interval = 1; ease = Math.max(1.3, ease - 0.2);
  } else {
    reps += 1;
    if(reps === 1) interval = 1;
    else if(reps === 2) interval = 3;
    else interval = Math.round(interval * ease);
    if(quality === 1) ease = Math.max(1.3, ease - 0.15);
    if(quality === 3) ease = ease + 0.15;
  }
  const due = new Date();
  due.setDate(due.getDate() + interval);
  note.srs = { interval, ease, reps };
  note.dueDate = fmtDate(due);
  note.updatedAt = new Date().toISOString();
  return note;
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', settings.theme);
  document.body.style.fontSize = settings.fontSize === 'sm' ? '15px' : settings.fontSize === 'lg' ? '18px' : '16px';
}

/* ---------- shell / navegação ---------- */
function renderShell(){
  document.getElementById('app').innerHTML =
    '<aside class="sidebar">' +
      '<div class="brand">Segundo<br>Cérebro</div>' +
      '<nav class="nav-rail">' +
        '<button data-route="inicio">'+icon('home',18)+' Início</button>' +
        '<button data-route="notas">'+icon('notes',18)+' Notas</button>' +
        '<button data-route="buscar">'+icon('search',18)+' Buscar</button>' +
        '<button data-route="revisar">'+icon('review',18)+' Revisar</button>' +
        '<button data-route="config">'+icon('settings',18)+' Ajustes</button>' +
      '</nav>' +
      '<button class="fab-inline" data-action="quick-capture">'+icon('plus',16)+' Nota rápida</button>' +
    '</aside>' +
    '<main id="main-content"></main>' +
    '<button class="fab" data-action="quick-capture" aria-label="Nota rápida">'+icon('plus',24)+'</button>' +
    '<nav class="bottom-nav">' +
      '<button data-route="inicio">'+icon('home',20)+'<span>Início</span></button>' +
      '<button data-route="notas">'+icon('notes',20)+'<span>Notas</span></button>' +
      '<button data-route="buscar">'+icon('search',20)+'<span>Buscar</span></button>' +
      '<button data-route="revisar">'+icon('review',20)+'<span>Revisar</span></button>' +
      '<button data-route="config">'+icon('settings',20)+'<span>Ajustes</span></button>' +
    '</nav>';
}
function renderNav(){
  const activeGroup = ['nota','editar','nova'].includes(currentRoute) ? 'notas' : currentRoute;
  document.querySelectorAll('[data-route]').forEach(el=>{
    el.classList.toggle('active', el.dataset.route === activeGroup);
  });
}
function go(hash){ location.hash = '#/' + hash; }
function route(){
  const raw = location.hash.replace(/^#\/?/, '');
  const parts = raw.split('/');
  currentRoute = parts[0] || 'inicio';
  currentNoteId = parts[1] ? Number(parts[1]) : null;
  renderNav();
  if(currentRoute === 'inicio') renderDashboard();
  else if(currentRoute === 'notas') renderNotesList();
  else if(currentRoute === 'buscar') renderSearchView();
  else if(currentRoute === 'revisar') renderReviewView();
  else if(currentRoute === 'config') renderConfigView();
  else if(currentRoute === 'nota') renderNoteDetail(currentNoteId);
  else if(currentRoute === 'editar') renderEditor(currentNoteId);
  else if(currentRoute === 'nova') renderEditor(null);
  else renderDashboard();
  window.scrollTo(0,0);
}

/* ---------- componente: cartão de nota ---------- */
function noteCardHTML(n){
  const color = colorForCategory(n.category);
  let html = '<div class="card clickable" style="--cat-color:'+color+'" data-action="open-note" data-id="'+n.id+'">';
  html += '<h3>' + (n.pinned ? icon('pin',11) : '') + escapeHTML(n.title) + '</h3>';
  html += '<div class="meta">';
  if(n.category) html += '<span>' + escapeHTML(n.category) + '</span>';
  html += '<span>' + relativeDate(n.updatedAt) + '</span>';
  if(n.isCard) html += '<span>cartão de revisão</span>';
  html += '</div>';
  if(n.content) html += '<p class="snippet">' + escapeHTML(snippet(n.content)) + '</p>';
  if(n.tags && n.tags.length) html += '<div class="chip-row" style="margin-top:.5rem;margin-bottom:0;">' + n.tags.map(t=>'<span class="tag">'+escapeHTML(t)+'</span>').join('') + '</div>';
  html += '</div>';
  return html;
}

/* ---------- telas ---------- */
function renderDashboard(){
  const total = notesCache.length;
  const cats = new Set(notesCache.map(n=>n.category).filter(Boolean));
  const today = fmtDate(new Date());
  const dueToday = notesCache.filter(n=>n.isCard && n.dueDate && n.dueDate <= today).length;
  let html = '<header class="topbar"><h1>Início</h1></header>';
  if(total === 0){
    html += '<div class="empty"><h2>Sua coleção ainda está vazia</h2>' +
      '<p>Comece registrando algo que você aprendeu, uma palavra nova ou uma ideia que quer guardar.</p>' +
      '<button class="btn btn-primary" data-action="new-note">Criar primeira nota</button></div>';
    main().innerHTML = html;
    return;
  }
  html += '<div class="stat-grid">' +
    '<div class="stat"><span class="num">'+total+'</span><span class="label">notas guardadas</span></div>' +
    '<div class="stat"><span class="num">'+cats.size+'</span><span class="label">assuntos diferentes</span></div>' +
    '<div class="stat"><span class="num">'+dueToday+'</span><span class="label">cartões para revisar hoje</span></div>' +
    '<div class="stat"><span class="num">'+notesCache.filter(n=>n.pinned).length+'</span><span class="label">notas fixadas</span></div>' +
    '</div>';
  if(dueToday > 0){
    html += '<button class="btn btn-primary btn-block" style="margin-bottom:1.5rem;" data-action="go" data-target="revisar">Revisar '+dueToday+' cartão(s) agora</button>';
  }
  const recap = pickNoteOfDay();
  if(recap){
    html += '<h3 style="margin-top:1.4rem;">Relembrando</h3>' + noteCardHTML(recap);
  }
  const recent = [...notesCache].sort((a,b)=> (b.updatedAt||'').localeCompare(a.updatedAt||'')).slice(0,5);
  html += '<h3 style="margin-top:1.4rem;">Editadas recentemente</h3>' + recent.map(noteCardHTML).join('');
  main().innerHTML = html;
}

function renderNotesList(){
  const cats = [...new Set(notesCache.map(n=>n.category).filter(Boolean))].sort();
  let list = [...notesCache];
  if(notesFilter.category) list = list.filter(n=>n.category === notesFilter.category);
  list.sort((a,b)=> (b.pinned - a.pinned) || (b.updatedAt||'').localeCompare(a.updatedAt||''));
  let html = '<header class="topbar"><h1>Notas</h1><button class="btn btn-primary" data-action="new-note">'+icon('plus',15)+' Nova</button></header>';
  if(cats.length){
    html += '<div class="chip-row"><button class="chip '+(!notesFilter.category?'active':'')+'" data-action="filter-cat" data-cat="">Todas</button>' +
      cats.map(c=>'<button class="chip '+(notesFilter.category===c?'active':'')+'" data-action="filter-cat" data-cat="'+escapeHTML(c)+'">'+escapeHTML(c)+'</button>').join('') +
      '</div>';
  }
  html += list.length ? list.map(noteCardHTML).join('') : '<div class="empty"><h2>Nenhuma nota aqui</h2><p>Ajuste o filtro ou crie uma nova nota.</p></div>';
  main().innerHTML = html;
}

function renderSearchView(){
  let html = '<header class="topbar"><h1>Buscar</h1></header>' +
    '<div class="field"><input type="search" id="search-input" placeholder="Buscar em títulos, tags e conteúdo…" value="'+escapeHTML(lastQuery)+'"></div>' +
    '<div id="search-results"></div>';
  main().innerHTML = html;
  const input = document.getElementById('search-input');
  input.addEventListener('input', debounce(()=>{ lastQuery = input.value; renderSearchResults(); }, 120));
  renderSearchResults();
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
}
function renderSearchResults(){
  const box = document.getElementById('search-results');
  if(!lastQuery.trim()){ box.innerHTML = '<div class="empty"><p>Digite para buscar — o resultado aparece na hora.</p></div>'; return; }
  const results = searchNotes(lastQuery);
  box.innerHTML = results.length ? results.map(noteCardHTML).join('') : '<div class="empty"><p>Nada encontrado para "'+escapeHTML(lastQuery)+'".</p></div>';
}

function renderReviewView(){
  const today = fmtDate(new Date());
  reviewQueue = notesCache.filter(n=>n.isCard && n.dueDate && n.dueDate <= today)
    .sort((a,b)=> (a.dueDate||'').localeCompare(b.dueDate||''));
  reviewIndex = 0; reviewRevealed = false;
  drawReview();
}
function drawReview(){
  let html = '<header class="topbar"><h1>Revisar</h1></header>';
  if(reviewQueue.length === 0){
    html += '<div class="empty"><h2>Nada para revisar agora</h2><p>Marque notas como cartão de revisão para elas aparecerem aqui quando vencerem.</p></div>';
  } else if(reviewIndex >= reviewQueue.length){
    html += '<div class="empty"><h2>Revisão concluída</h2><p>Você revisou '+reviewQueue.length+' cartão(s) por hoje.</p></div>';
  } else {
    const n = reviewQueue[reviewIndex];
    html += '<div class="review-progress">'+(reviewIndex+1)+' de '+reviewQueue.length+'</div>';
    html += '<div class="flash-card"><div class="front">'+escapeHTML(n.title)+'</div>';
    if(reviewRevealed) html += '<div class="back">'+renderContent(n.content || '(sem conteúdo)')+'</div>';
    html += '</div>';
    if(!reviewRevealed){
      html += '<button class="btn btn-primary btn-block" data-action="reveal-card">Mostrar resposta</button>';
    } else {
      html += '<div class="review-actions">' +
        '<button class="btn btn-danger" data-action="grade-card" data-q="0">Errei</button>' +
        '<button class="btn" data-action="grade-card" data-q="1">Difícil</button>' +
        '<button class="btn" data-action="grade-card" data-q="2">Bom</button>' +
        '<button class="btn btn-primary" data-action="grade-card" data-q="3">Fácil</button>' +
        '</div>';
    }
  }
  main().innerHTML = html;
}

function renderConfigView(){
  const totalCards = notesCache.filter(n=>n.isCard).length;
  let html = '<header class="topbar"><h1>Ajustes</h1></header>';
  html += '<div class="field"><label>Tema</label><div class="theme-row"><span>Claro</span>' +
    '<label class="switch"><input type="checkbox" id="theme-switch" '+(settings.theme==='dark'?'checked':'')+'><span class="slider"></span></label>' +
    '<span>Escuro</span></div></div>';
  html += '<div class="field"><label>Tamanho do texto</label><select id="fontsize-select">' +
    '<option value="sm" '+(settings.fontSize==='sm'?'selected':'')+'>Pequeno</option>' +
    '<option value="md" '+(settings.fontSize==='md'?'selected':'')+'>Médio</option>' +
    '<option value="lg" '+(settings.fontSize==='lg'?'selected':'')+'>Grande</option>' +
    '</select></div>';
  html += '<div class="stat-grid">' +
    '<div class="stat"><span class="num">'+notesCache.length+'</span><span class="label">notas no total</span></div>' +
    '<div class="stat"><span class="num">'+totalCards+'</span><span class="label">cartões de revisão</span></div>' +
    '</div>';
  html += '<h3>Backup</h3>' +
    '<p class="hint">Suas notas ficam guardadas só neste navegador, neste aparelho — não há sincronização automática entre computador e celular. Exporte com frequência e use "Importar" para levar as notas para outro navegador ou dispositivo.</p>' +
    '<div class="chip-row">' +
    '<button class="btn" data-action="export-data">Exportar backup (.json)</button>' +
    '<label class="btn" style="cursor:pointer;">Importar backup<input type="file" id="import-file" accept="application/json" style="display:none;"></label>' +
    '</div>';
  html += '<h3 style="margin-top:1.4rem;">Atalhos do teclado</h3>' +
    '<p class="hint">No computador: pressione / para buscar e n para abrir a captura rápida, em qualquer tela.</p>';
  html += '<div class="danger-zone"><h3>Apagar tudo</h3>' +
    '<p class="hint">Remove todas as notas deste navegador, permanentemente.</p>' +
    '<button class="btn btn-danger" data-action="wipe-data">Apagar todos os dados</button></div>';
  main().innerHTML = html;
  document.getElementById('theme-switch').addEventListener('change', async e=>{
    settings.theme = e.target.checked ? 'dark' : 'light';
    applyTheme(); await setMeta('settings', settings);
  });
  document.getElementById('fontsize-select').addEventListener('change', async e=>{
    settings.fontSize = e.target.value; applyTheme(); await setMeta('settings', settings);
  });
  document.getElementById('import-file').addEventListener('change', handleImport);
}

function renderNoteDetail(id){
  const n = notesCache.find(x=>x.id === id);
  if(!n){ go('notas'); return; }
  const backlinks = notesCache.filter(o=> o.id !== n.id && new RegExp('\\[\\[' + escapeRegex(n.title) + '\\]\\]','i').test(o.content||''));
  let html = '<header class="topbar"><button class="btn-text" data-action="go" data-target="notas">'+icon('chevronLeft',17)+' Voltar</button></header>';
  html += '<div class="chip-row">';
  if(n.category) html += '<span class="chip">'+escapeHTML(n.category)+'</span>';
  html += (n.tags||[]).map(t=>'<span class="tag">'+escapeHTML(t)+'</span>').join('');
  html += '</div>';
  html += '<h1>'+escapeHTML(n.title)+'</h1>';
  html += '<p class="hint">Atualizado '+relativeDate(n.updatedAt)+(n.isCard? ' · cartão de revisão':'')+'</p>';
  html += '<div class="note-content">'+renderContent(n.content||'')+'</div>';
  if(backlinks.length){
    html += '<div class="backlinks"><h4>Notas que citam esta</h4>'+backlinks.map(noteCardHTML).join('')+'</div>';
  }
  html += '<div class="chip-row" style="margin-top:1.5rem;">' +
    '<button class="btn" data-action="edit-note" data-id="'+n.id+'">Editar</button>' +
    '<button class="btn" data-action="toggle-pin" data-id="'+n.id+'">'+(n.pinned? 'Desafixar':'Fixar')+'</button>' +
    '<button class="btn btn-danger" data-action="delete-note" data-id="'+n.id+'">Excluir</button>' +
    '</div>';
  main().innerHTML = html;
}

function renderEditor(id){
  const editing = id != null;
  const n = editing ? notesCache.find(x=>x.id === id) : { title:'', category:'', tags:[], content:'', isCard:false };
  if(editing && !n){ go('notas'); return; }
  const cats = [...new Set(notesCache.map(x=>x.category).filter(Boolean))].sort();
  let html = '<header class="topbar"><h1>'+(editing?'Editar nota':'Nova nota')+'</h1></header>';
  html += '<form id="note-form">';
  html += '<div class="field"><label>Título</label><input type="text" name="title" value="'+escapeHTML(n.title)+'" required></div>';
  html += '<div class="field"><label>Assunto</label><input type="text" name="category" list="cat-list" value="'+escapeHTML(n.category||'')+'" placeholder="ex.: Mecânica, Vocabulário, Psicologia">' +
    '<datalist id="cat-list">'+cats.map(c=>'<option value="'+escapeHTML(c)+'">').join('')+'</datalist></div>';
  html += '<div class="field"><label>Tags (separadas por vírgula)</label><input type="text" name="tags" value="'+escapeHTML((n.tags||[]).join(', '))+'"></div>';
  html += '<div class="field"><label>Conteúdo</label><textarea name="content" placeholder="Escreva o que quiser lembrar. Use [[Título]] para linkar outra nota, **negrito**, _itálico_ e - para listas.">'+escapeHTML(n.content||'')+'</textarea></div>';
  html += '<div class="field theme-row"><label class="switch"><input type="checkbox" name="isCard" '+(n.isCard?'checked':'')+'><span class="slider"></span></label><span>Marcar como cartão de revisão</span></div>';
  html += '<div class="chip-row">' +
    '<button type="submit" class="btn btn-primary">Salvar</button>' +
    '<button type="button" class="btn" data-action="cancel-edit" data-id="'+(editing? n.id:'')+'">Cancelar</button>' +
    '</div>';
  html += '</form>';
  main().innerHTML = html;
  document.querySelector('[name=title]').focus();
}

/* ---------- captura rápida ---------- */
function openQuickCapture(){
  const cats = [...new Set(notesCache.map(n=>n.category).filter(Boolean))];
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'quick-overlay';
  overlay.innerHTML =
    '<div class="modal">' +
      '<div class="topbar"><h1 style="font-size:1.15rem;">Captura rápida</h1><button class="btn-text" data-action="close-modal">'+icon('close',18)+'</button></div>' +
      '<div class="field"><textarea id="quick-content" placeholder="Escreva rapidamente o que quer guardar…" style="min-height:120px;"></textarea></div>' +
      '<div class="field"><input type="text" id="quick-category" placeholder="Assunto (opcional)" list="cat-list-quick">' +
      '<datalist id="cat-list-quick">'+cats.map(c=>'<option value="'+escapeHTML(c)+'">').join('')+'</datalist></div>' +
      '<button class="btn btn-primary btn-block" data-action="save-quick">Guardar</button>' +
    '</div>';
  document.body.appendChild(overlay);
  document.getElementById('quick-content').focus();
  overlay.addEventListener('click', e=>{ if(e.target === overlay) closeModal(); });
}
function closeModal(){ const o = document.getElementById('quick-overlay'); if(o) o.remove(); }
async function saveQuickCapture(){
  const contentEl = document.getElementById('quick-content');
  const content = contentEl.value.trim();
  if(!content){ closeModal(); return; }
  const category = document.getElementById('quick-category').value.trim();
  const title = content.split('\n')[0].slice(0,60) || 'Nota rápida';
  const now = new Date().toISOString();
  const note = { title, category, tags:[], content, isCard:false, createdAt:now, updatedAt:now, pinned:false, dueDate:null, srs:null };
  const saved = await addNote(note);
  notesCache.push(saved);
  closeModal();
  go('nota/' + saved.id);
}

/* ---------- backup ---------- */
function exportData(){
  const data = { app:'segundo-cerebro', version:1, exportedAt:new Date().toISOString(), notes:notesCache };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'segundo-cerebro-backup-' + fmtDate(new Date()) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
async function handleImport(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    const imported = Array.isArray(data.notes) ? data.notes : (Array.isArray(data) ? data : null);
    if(!imported) throw new Error('formato inválido');
    if(!confirm('Importar ' + imported.length + ' nota(s)? Elas serão adicionadas às existentes, sem substituir nada.')) return;
    for(const n of imported){
      const clean = {
        title: n.title || 'Sem título', category: n.category || '', tags: n.tags || [],
        content: n.content || '', isCard: !!n.isCard,
        createdAt: n.createdAt || new Date().toISOString(), updatedAt: n.updatedAt || new Date().toISOString(),
        pinned: !!n.pinned, dueDate: n.dueDate || null, srs: n.srs || null
      };
      const saved = await addNote(clean);
      notesCache.push(saved);
    }
    alert('Notas importadas com sucesso.');
    renderConfigView();
  } catch(err){
    alert('Não foi possível importar este arquivo. Verifique se é um backup exportado por este programa.');
  }
}

/* ---------- eventos ---------- */
async function onClick(e){
  const wl = e.target.closest('.wikilink');
  if(wl){
    e.preventDefault();
    const title = wl.dataset.title;
    const found = notesCache.find(n=> n.title.toLowerCase() === title.toLowerCase());
    if(found){ go('nota/' + found.id); }
    else if(confirm('Não existe nota "' + title + '". Criar agora?')){
      go('nova');
      requestAnimationFrame(()=>{ const t = document.querySelector('[name=title]'); if(t) t.value = title; });
    }
    return;
  }
  const navEl = e.target.closest('[data-route]');
  if(navEl){ go(navEl.dataset.route); return; }

  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action === 'go') go(el.dataset.target);
  else if(action === 'open-note') go('nota/' + el.dataset.id);
  else if(action === 'new-note') go('nova');
  else if(action === 'edit-note') go('editar/' + el.dataset.id);
  else if(action === 'cancel-edit'){ const id = el.dataset.id; go(id ? 'nota/' + id : 'notas'); }
  else if(action === 'delete-note'){
    if(confirm('Excluir esta nota permanentemente?')){
      const id = Number(el.dataset.id);
      await deleteNoteDB(id);
      notesCache = notesCache.filter(n=>n.id !== id);
      go('notas');
    }
  }
  else if(action === 'toggle-pin'){
    const id = Number(el.dataset.id);
    const n = notesCache.find(x=>x.id === id);
    n.pinned = !n.pinned;
    await putNote(n);
    renderNoteDetail(id);
  }
  else if(action === 'filter-cat'){ notesFilter.category = el.dataset.cat || null; renderNotesList(); }
  else if(action === 'reveal-card'){ reviewRevealed = true; drawReview(); }
  else if(action === 'grade-card'){
    const q = Number(el.dataset.q);
    const n = reviewQueue[reviewIndex];
    scheduleReview(n, q);
    await putNote(n);
    reviewIndex++; reviewRevealed = false; drawReview();
  }
  else if(action === 'export-data') exportData();
  else if(action === 'wipe-data'){
    if(confirm('Apagar TODAS as notas deste navegador? Esta ação não pode ser desfeita.') &&
       confirm('Tem certeza mesmo? Não há como recuperar depois disso.')){
      await wipeAllDB();
      notesCache = [];
      go('inicio');
    }
  }
  else if(action === 'quick-capture') openQuickCapture();
  else if(action === 'close-modal') closeModal();
  else if(action === 'save-quick') await saveQuickCapture();
}

async function onSubmit(e){
  if(e.target.id !== 'note-form') return;
  e.preventDefault();
  const fd = new FormData(e.target);
  const title = (fd.get('title')||'').trim() || 'Sem título';
  const category = (fd.get('category')||'').trim();
  const tags = (fd.get('tags')||'').split(',').map(t=>t.trim()).filter(Boolean);
  const content = fd.get('content') || '';
  const isCard = fd.get('isCard') === 'on';
  const now = new Date().toISOString();
  if(currentRoute === 'editar' && currentNoteId != null){
    const n = notesCache.find(x=>x.id === currentNoteId);
    if(n){
      Object.assign(n, { title, category, tags, content, isCard, updatedAt: now });
      if(isCard && !n.dueDate) n.dueDate = fmtDate(new Date());
      if(!isCard) n.dueDate = null;
      await putNote(n);
      go('nota/' + n.id);
      return;
    }
  }
  const note = { title, category, tags, content, isCard, createdAt: now, updatedAt: now, pinned:false, dueDate: isCard ? fmtDate(new Date()) : null, srs:null };
  const saved = await addNote(note);
  notesCache.push(saved);
  go('nota/' + saved.id);
}

function onKeydown(e){
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if(typing) return;
  if(e.key === '/'){ e.preventDefault(); go('buscar'); }
  else if(e.key === 'n'){ e.preventDefault(); openQuickCapture(); }
  else if(e.key === 'Escape'){ closeModal(); }
}

/* ---------- inicialização ---------- */
async function init(){
  try{
    await openDB();
  } catch(err){
    document.getElementById('app').innerHTML = '<div class="empty" style="padding:4rem 1.5rem;"><h2>Não foi possível abrir o armazenamento local</h2><p>Tente atualizar a página ou usar outro navegador (Chrome, Firefox ou Edge atualizados).</p></div>';
    return;
  }
  notesCache = await getAllNotesDB();
  const saved = await getMeta('settings');
  if(saved) Object.assign(settings, saved);
  applyTheme();
  renderShell();
  document.addEventListener('click', onClick);
  document.addEventListener('submit', onSubmit);
  document.addEventListener('keydown', onKeydown);
  window.addEventListener('hashchange', route);
  route();
}
init();
</script>
