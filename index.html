<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Busca Inteligente Offline</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❓</text></svg>">
<style>
  :root {
    --bg: #0f1115;
    --bg2: #1a1d24;
    --bg3: #252a33;
    --border: #2e3440;
    --text: #e5e9f0;
    --text2: #a0a8b8;
    --accent: #5e9cff;
    --accent2: #3d7acc;
    --success: #4caf7a;
    --danger: #e06c75;
    --warning: #e5c07b;
    --radius: 10px;
    --shadow: 0 4px 20px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }
  /* Sidebar */
  .sidebar {
    width: 280px;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sidebar-header h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }
  .logo {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .sidebar-section {
    padding: 12px 12px 4px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text2);
    font-weight: 600;
  }
  .sidebar-list {
    list-style: none;
    padding: 0 8px 8px;
    overflow-y: auto;
    flex: 1;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    color: var(--text2);
    transition: all 0.15s;
    user-select: none;
  }
  .sidebar-item:hover { background: var(--bg3); color: var(--text); }
  .sidebar-item.active { background: var(--accent); color: #fff; }
  .sidebar-item .count {
    margin-left: auto;
    font-size: 11px;
    background: rgba(255,255,255,0.12);
    padding: 1px 7px;
    border-radius: 10px;
  }
  .sidebar-item.active .count { background: rgba(255,255,255,0.25); }
  .sidebar-actions {
    padding: 10px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 14px;
    border-radius: 8px;
    border: none;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-ghost {
    background: transparent;
    color: var(--text2);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: var(--bg3); color: var(--text); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-sm { padding: 6px 10px; font-size: 12px; }
  .btn-icon {
    width: 32px; height: 32px;
    padding: 0;
    border-radius: 8px;
    background: transparent;
    border: none;
    color: var(--text2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-icon:hover { background: var(--bg3); color: var(--text); }
  /* Main */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .toolbar {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
    background: var(--bg2);
  }
  .search-box {
    flex: 1;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 10px 14px 10px 38px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border 0.15s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box .icon {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--text2);
    font-size: 15px;
  }
  .search-filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    background: var(--bg3);
    border-radius: 20px;
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
  }
  .chip.active { background: var(--accent); color: #fff; }
  .chip .x { font-size: 11px; opacity: 0.7; }
  /* Content area */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }
  .boot-overlay {
    position: fixed;
    inset: 0;
    z-index: 400;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .boot-overlay.hide { display: none; }
  .boot-overlay p { color: var(--text2); font-size: 13.5px; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .list-header {
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 12px;
  }
  #virtSpacer { position: relative; width: 100%; }
  .doc-card.virt {
    box-shadow: 0 -6px 14px rgba(0, 0, 0, 0.18);
    position: absolute;
    left: 0;
    right: 0;
  }
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text2);
  }
  .empty-state h2 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
  .empty-state p { font-size: 14px; max-width: 360px; margin: 0 auto 20px; }
  /* Document list */
  .doc-list { display: flex; flex-direction: column; gap: 10px; }
  .doc-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    cursor: pointer;
    transition: all 0.15s;
    min-height: 110px;
  }
  .doc-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow); }
  .doc-card .title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .doc-card .snippet {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .doc-card .meta {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    font-size: 11.5px;
    color: var(--text2);
    flex-wrap: wrap;
    align-items: center;
  }
  .tag {
    background: rgba(94,156,255,0.15);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
  }
  .score {
    margin-left: auto;
    color: var(--success);
    font-weight: 600;
  }
  mark {
    background: rgba(229,192,123,0.35);
    color: var(--warning);
    padding: 0 2px;
    border-radius: 2px;
  }
  /* Document view / editor */
  .doc-view {
    max-width: 820px;
    margin: 0 auto;
  }
  .doc-view-header {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    align-items: flex-start;
  }
  .doc-view-header input.title-input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 22px;
    font-weight: 600;
    outline: none;
    padding: 4px 0;
  }
  .doc-meta-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
    align-items: center;
  }
  .doc-meta-row select, .doc-meta-row input[type="text"] {
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
  }
  .doc-meta-row select:focus, .doc-meta-row input:focus { border-color: var(--accent); }
  textarea.content-area {
    width: 100%;
    min-height: 420px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 18px;
    font-size: 14.5px;
    line-height: 1.65;
    resize: vertical;
    outline: none;
    font-family: inherit;
    display: block;
  }
  textarea.content-area:focus { border-color: var(--accent); }

  .editor-wrap {
    position: relative;
  }
  .find-overlay {
    display: none;
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-wrap: break-word;
    color: var(--text);
    background: var(--bg2);
    border-radius: var(--radius);
    z-index: 0;
  }
  .editor-wrap.find-active .find-overlay { display: block; }
  .editor-wrap.find-active textarea.content-area {
    color: transparent;
    caret-color: var(--text);
    background: transparent;
    position: relative;
    z-index: 1;
  }
  .find-overlay mark.find-other {
    background: rgba(229, 192, 123, 0.28);
    color: inherit;
    border-radius: 2px;
  }
  .find-overlay mark.find-current {
    background: #e5c07b;
    color: #1a1d24;
    border-radius: 2px;
    padding: 0 1px;
  }

  /* Find bar (inside note) */
  .find-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
    padding: 8px 10px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    flex-wrap: wrap;
  }
  .find-bar input {
    flex: 1;
    min-width: 120px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 12px;
    font-size: 14px;
    outline: none;
  }
  .find-bar input:focus { border-color: var(--accent); }
  .find-count {
    font-size: 12.5px;
    color: var(--text2);
    min-width: 48px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .tags-input-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .tags-input-wrap input {
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 13px;
    outline: none;
    min-width: 100px;
  }
  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    width: 90%;
    max-width: 420px;
    box-shadow: var(--shadow);
  }
  .modal h3 { margin-bottom: 14px; font-size: 17px; }
  .modal input, .modal select {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 12px;
    outline: none;
  }
  .modal input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--bg3);
    border: 1px solid var(--border);
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 13.5px;
    z-index: 200;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.25s;
    box-shadow: var(--shadow);
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  /* Advanced search panel */
  .adv-panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 16px;
    display: none;
  }
  .adv-panel.open { display: block; }
  .adv-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 10px;
  }
  .adv-row label { font-size: 12px; color: var(--text2); min-width: 70px; }
  .adv-row select, .adv-row input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #3d4450; }

  /* Overlay for mobile sidebar */
  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 40;
    opacity: 0;
    transition: opacity 0.25s;
  }
  .sidebar-overlay.show {
    display: block;
    opacity: 1;
  }

  .sidebar-close {
    display: none;
    margin-left: auto;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--bg3);
    border: none;
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
  }

  .mobile-toggle { display: none; }

  /* ========== MOBILE OPTIMIZATIONS ========== */
  @media (max-width: 700px) {
    body { height: 100dvh; } /* better mobile viewport */

    .sidebar {
      position: fixed;
      left: -300px;
      top: 0;
      bottom: 0;
      width: 280px;
      max-width: 85vw;
      z-index: 50;
      transition: left 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 4px 0 24px rgba(0,0,0,0.4);
    }
    .sidebar.open { left: 0; }

    .sidebar-close { display: flex; }

    .mobile-toggle {
      display: flex !important;
      width: 42px;
      height: 42px;
      font-size: 20px;
      flex-shrink: 0;
    }

    .toolbar {
      padding: 10px 12px;
      gap: 8px;
    }

    .search-box input {
      padding: 11px 12px 11px 36px;
      font-size: 16px; /* prevents iOS zoom */
      border-radius: 12px;
    }

    .toolbar .btn-ghost.btn-sm {
      padding: 8px 10px;
      font-size: 12px;
      white-space: nowrap;
    }

    .content {
      padding: 14px 12px;
    }

    .doc-card {
      padding: 14px 14px;
      border-radius: 12px;
    }

    .doc-card .title { font-size: 15px; }
    .doc-card .snippet { font-size: 13px; -webkit-line-clamp: 3; }

    .doc-view-header {
      flex-wrap: wrap;
      gap: 8px;
    }
    .doc-view-header input.title-input {
      font-size: 18px;
      width: 100%;
      order: -1;
    }

    .doc-meta-row {
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
    }
    .doc-meta-row select,
    .doc-meta-row .tags-input-wrap {
      width: 100%;
    }

    textarea.content-area {
      min-height: 50vh;
      font-size: 16px; /* prevents zoom */
      padding: 14px;
    }

    .find-bar {
      padding: 8px;
      gap: 5px;
    }
    .find-bar input {
      font-size: 16px; /* prevents iOS zoom */
      padding: 10px 12px;
    }
    .find-bar .btn {
      min-width: 40px;
      height: 38px;
      padding: 0;
      font-size: 16px;
    }

    .sidebar-item {
      padding: 12px 12px; /* larger touch target */
      font-size: 14.5px;
    }

    .sidebar-actions .btn {
      padding: 12px 14px;
      font-size: 14px;
    }

    .empty-state { padding: 50px 16px; }

    .modal {
      width: 94%;
      max-width: none;
      margin: 0 12px;
    }

    /* Hide less important buttons on very small screens to save space */
    @media (max-width: 380px) {
      .toolbar .btn-ghost.btn-sm:nth-of-type(1) { display: none; } /* Avançado */
    }
  }
</style>
</head>
<body>

<!-- Overlay to close sidebar on mobile -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">🔍</div>
    <h1>Busca Offline</h1>
    <button class="sidebar-close" onclick="closeSidebar()" aria-label="Fechar menu">✕</button>
  </div>

  <div class="sidebar-section">Pastas</div>
  <ul class="sidebar-list" id="folderList"></ul>

  <div class="sidebar-section">Tags</div>
  <ul class="sidebar-list" id="tagList" style="max-height:180px;"></ul>

  <div class="sidebar-actions">
    <button class="btn btn-primary" onclick="newDoc(); closeSidebar()">+ Novo Texto</button>
    <button class="btn btn-ghost btn-sm" onclick="openModal('folder')">+ Pasta</button>
    <button class="btn btn-ghost btn-sm" onclick="exportData()">Exportar JSON</button>
    <button class="btn btn-ghost btn-sm" onclick="document.getElementById('importFile').click()">Importar</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
  </div>
</aside>

<main class="main">
  <div class="content" id="content">
    <!-- dynamic -->
  </div>
  <div class="toolbar">
    <button class="btn-icon mobile-toggle" onclick="toggleSidebar()" aria-label="Abrir menu">☰</button>
    <div class="search-box">
      <span class="icon">⌕</span>
      <input type="text" id="searchInput" placeholder="Buscar... (&quot;frase exata&quot; ou palavras)" autocomplete="off">
    </div>
    <button class="btn btn-ghost btn-sm" onclick="toggleAdv()">Avançado</button>
    <button class="btn btn-ghost btn-sm" onclick="clearSearch()">Limpar</button>
  </div>

  
</main>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modalTitle">Nova Pasta</h3>
    <input type="text" id="modalInput" placeholder="Nome...">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="modalConfirm">Criar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="boot-overlay" id="bootOverlay">
  <div class="spinner"></div>
  <p id="bootMsg">Abrindo biblioteca...</p>
</div>

<script>
/* ============================================================
   BUSCA INTELIGENTE OFFLINE — Single Page App
   IndexedDB + BM25 + Stemming PT-BR + Tags + Pastas + Export
   ============================================================ */

const DB_NAME = 'BuscaInteligenteDB';
const DB_VER = 2;
const ITEM_H = 126;
const VIRT_BUFFER = 6;
const SEARCH_CAP = 1500;

let db = null;
let folders = [];
let foldersById = new Map();
let metaById = new Map();
let metaOrder = []; // ids by updatedAt desc
let folderCounts = new Map();
let tagCounts = new Map();
let stats = { id: 'global', N: 0, totalLen: 0 };
let currentFolderId = null;
let currentTag = null;
let currentView = 'list';
let editingDoc = null;
let searchQuery = '';
let searchResults = null; // array of meta with _score
let searchTimer = null;
let searchGen = 0;
let listItems = [];
let listScrollTop = 0;
let advOpen = false;
let bootReady = false;

/* ---------- Portuguese Normalization & Stemming ---------- */
function removeAccents(str) {
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function normalize(str) {
  return removeAccents(str.toLowerCase().trim());
}

function stemPT(word) {
  word = normalize(word);
  if (word.length < 4) return word;

  const suffixes = [
    { s: 'ões', r: 'ão' }, { s: 'ães', r: 'ão' }, { s: 'ais', r: 'al' },
    { s: 'éis', r: 'el' }, { s: 'óis', r: 'ol' }, { s: 'ns', r: 'm' },
    { s: 's', r: '' },
    { s: 'ando', r: 'ar' }, { s: 'endo', r: 'er' }, { s: 'indo', r: 'ir' },
    { s: 'ado', r: 'ar' }, { s: 'ido', r: 'ir' },
    { s: 'ava', r: 'ar' }, { s: 'ia', r: 'ir' },
    { s: 'ará', r: 'ar' }, { s: 'erá', r: 'er' }, { s: 'irá', r: 'ir' },
    { s: 'ariam', r: 'ar' }, { s: 'eriam', r: 'er' }, { s: 'iriam', r: 'ir' },
    { s: 'assem', r: 'ar' }, { s: 'essem', r: 'er' }, { s: 'issem', r: 'ir' },
    { s: 'mente', r: '' }, { s: 'idade', r: '' }, { s: 'ismo', r: '' },
    { s: 'oso', r: '' }, { s: 'osa', r: '' }, { s: 'ável', r: '' },
    { s: 'ível', r: '' }, { s: 'ção', r: '' }, { s: 'são', r: '' }
  ];

  for (const { s, r } of suffixes) {
    if (word.endsWith(s) && word.length - s.length + r.length >= 3) {
      return word.slice(0, -s.length) + r;
    }
  }
  return word;
}

function tokenize(text) {
  return normalize(text)
    .replace(/[^\w\s]/g, ' ')
    .split(/\s+/)
    .filter(t => t.length > 2)
    .map(stemPT);
}

function tokenTf(text) {
  const tokens = tokenize(text);
  const tf = {};
  for (const t of tokens) tf[t] = (tf[t] || 0) + 1;
  return { tf, length: tokens.length };
}

function indexText(doc) {
  return `${doc.title || ''} ${(doc.tags || []).join(' ')} ${doc.content || ''}`;
}

function toMeta(doc) {
  const plain = (doc.content || '').replace(/\s+/g, ' ').trim();
  return {
    id: doc.id,
    title: doc.title || 'Sem título',
    folderId: doc.folderId || null,
    tags: doc.tags || [],
    createdAt: doc.createdAt,
    updatedAt: doc.updatedAt,
    snippet: plain.slice(0, 240),
    wordCount: tokenize(indexText(doc)).length
  };
}

/* ---------- BM25 ---------- */
const BM25_K1 = 1.5;
const BM25_B = 0.75;

function bm25Add(scoreMap, token, posting) {
  if (!posting || !posting.p) return;
  const df = posting.df || Object.keys(posting.p).length;
  const N = stats.N || 1;
  const avgdl = (stats.totalLen / N) || 1;
  const idf = Math.log(1 + (N - df + 0.5) / (df + 0.5));
  for (const [idStr, tf] of Object.entries(posting.p)) {
    const id = +idStr;
    const m = metaById.get(id);
    if (!m) continue;
    if (!passesFilters(m)) continue;
    const dl = m.wordCount || 1;
    const tfNorm = (tf * (BM25_K1 + 1)) / (tf + BM25_K1 * (1 - BM25_B + BM25_B * (dl / avgdl)));
    scoreMap.set(id, (scoreMap.get(id) || 0) + idf * tfNorm);
  }
}

/* ---------- IndexedDB ---------- */
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains('docs')) {
        const store = database.createObjectStore('docs', { keyPath: 'id', autoIncrement: true });
        store.createIndex('folderId', 'folderId', { unique: false });
        store.createIndex('updatedAt', 'updatedAt', { unique: false });
      }
      if (!database.objectStoreNames.contains('folders')) {
        database.createObjectStore('folders', { keyPath: 'id', autoIncrement: true });
      }
      if (!database.objectStoreNames.contains('meta')) {
        database.createObjectStore('meta', { keyPath: 'id' });
      }
      if (!database.objectStoreNames.contains('postings')) {
        database.createObjectStore('postings', { keyPath: 't' });
      }
      if (!database.objectStoreNames.contains('docTokens')) {
        database.createObjectStore('docTokens', { keyPath: 'id' });
      }
      if (!database.objectStoreNames.contains('stats')) {
        database.createObjectStore('stats', { keyPath: 'id' });
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e.target.error);
  });
}

function dbGetAll(storeName) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbGet(storeName, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbCount(storeName) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).count();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);

}

function dbPut(storeName, item) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    const req = tx.objectStore(storeName).put(item);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);

}

function dbDelete(storeName, id) {
  return new Promise((resolve, reject) => {

    const req = tx.objectStore(storeName).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);

}

function dbClear(storeName) {

}

function dbGetAllKeys(storeName) {

function yieldToUI() {
  return new Promise(r => setTimeout(r, 0));
}

function setBoot(msg) {
  const el = document.getElementById('bootMsg');
  if (el) el.textContent = msg;
}

function hideBoot() {
  document.getElementById('bootOverlay').classList.add('hide');
}

/* Incremental inverted index — only the saved/deleted note is rewritten */
function reindexDoc(id, text, remove) {
  return new Promise(async (resolve, reject) => {
    try {
      const old = await dbGet('docTokens', id);
      const neu = remove ? { tf: {}, length: 0 } : tokenTf(text);
      const changed = new Set([
        ...Object.keys(old?.tf || {}),
        ...Object.keys(neu.tf)
      ]);

      const tx = db.transaction(['postings', 'docTokens', 'stats'], 'readwrite');
      const postings = tx.objectStore('postings');
      const tokensStore = tx.objectStore('docTokens');
      const statsStore = tx.objectStore('stats');
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);

      const hadOld = !!(old && old.length);
      if (remove) {
        if (hadOld) {
          stats.N = Math.max(0, (stats.N || 0) - 1);
          stats.totalLen = Math.max(0, (stats.totalLen || 0) - (old.length || 0));
        }
        tokensStore.delete(id);
      } else {
        if (!hadOld) stats.N = (stats.N || 0) + 1;
        stats.totalLen = (stats.totalLen || 0) - (old?.length || 0) + neu.length;
        tokensStore.put({ id, tf: neu.tf, length: neu.length });
      }
      stats.id = 'global';
      statsStore.put(stats);

      for (const tok of changed) {
        const g = postings.get(tok);
        g.onsuccess = () => {
          const row = g.result || { t: tok, p: {} };
          const now = neu.tf[tok];
          if (now) row.p[String(id)] = now;
          else delete row.p[String(id)];
          row.df = Object.keys(row.p).length;
          if (row.df === 0) postings.delete(tok);
          else postings.put(row);
        };
      }
    } catch (err) {
      reject(err);
    }
  });
}

function rebuildMemoryIndexes() {
  foldersById = new Map(folders.map(f => [f.id, f]));
  folderCounts = new Map();
  tagCounts = new Map();
  for (const m of metaById.values()) {
    const fid = m.folderId || 0;
    folderCounts.set(fid, (folderCounts.get(fid) || 0) + 1);
    (m.tags || []).forEach(t => tagCounts.set(t, (tagCounts.get(t) || 0) + 1));
  }
  metaOrder = [...metaById.values()]
    .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))
    .map(m => m.id);
}

function upsertMetaMemory(m) {
  metaById.set(m.id, m);
  rebuildMemoryIndexes();
}

function removeMetaMemory(id) {
  metaById.delete(id);
  rebuildMemoryIndexes();
}

async function ensureIndexed() {
  const nDocs = await dbCount('docs');
  const nMeta = await dbCount('meta');
  if (nDocs === 0) return;
  if (nMeta === nDocs && (stats.N || 0) === nDocs) return;

  setBoot('Indexando textos para busca rápida...');
  await dbClear('meta');
  await dbClear('postings');
  await dbClear('docTokens');
  stats = { id: 'global', N: 0, totalLen: 0 };

  const keys = await dbGetAllKeys('docs');
  for (let i = 0; i < keys.length; i++) {
    const d = await dbGet('docs', keys[i]);
    if (!d) continue;
    await dbPut('meta', toMeta(d));
    await reindexDoc(d.id, indexText(d), false);
    if (i % 15 === 0) {
      setBoot(`Indexando ${i + 1} / ${keys.length}`);
      await yieldToUI();
    }
  }
  await dbPut('stats', stats);
}

async function boot() {
  setBoot('Abrindo biblioteca...');
  folders = await dbGetAll('folders');
  const st = await dbGet('stats', 'global');
  if (st) stats = st;
  await ensureIndexed();
  const metas = await dbGetAll('meta');
  metaById = new Map(metas.map(m => [m.id, m]));
  rebuildMemoryIndexes();
  bootReady = true;
  hideBoot();
  renderSidebar();
  renderContent();
}

function passesFilters(m) {
  if (currentFolderId !== null && m.folderId !== currentFolderId) return false;
  if (currentTag && !(m.tags || []).includes(currentTag)) return false;
  return true;
}

function getFilteredMeta() {
  if (searchResults) return searchResults;
  const out = [];
  for (const id of metaOrder) {
    const m = metaById.get(id);
    if (m && passesFilters(m)) out.push(m);
  }
  return out;
}

function renderContent() {
  const el = document.getElementById('content');
  el.onscroll = null;

  if (currentView === 'edit' && editingDoc) {
    renderEditor(el);
    return;
  }

  listItems = getFilteredMeta();

  if (listItems.length === 0) {
    el.innerHTML = `
      <div class="empty-state">
        <h2>${searchQuery ? 'Nenhum resultado encontrado' : 'Nenhum texto ainda'}</h2>
        <p>${searchQuery ? 'Tente outras palavras ou remova filtros.' : 'Cole seus textos diários. Depois busque com precisão cirúrgica.'}</p>
        ${!searchQuery ? '<button class="btn btn-primary" onclick="newDoc()">+ Adicionar primeiro texto</button>' : ''}
      </div>`;
    return;
  }

  const header = searchQuery.trim()
    ? `${listItems.length}${listItems.length >= SEARCH_CAP ? '+' : ''} resultado(s) para “${escapeHtml(searchQuery)}”`
    : `${listItems.length} texto(s)`;

  el.innerHTML = `
    <div class="list-header" id="listHeader">${header}</div>
    <div id="virtSpacer"></div>`;
  el.onscroll = onListScroll;
  el.scrollTop = listScrollTop;
  paintVirtual();
}

function onListScroll() {
  const el = document.getElementById('content');
  if (!el) return;
  listScrollTop = el.scrollTop;
  paintVirtual();
}

function paintVirtual() {
  const el = document.getElementById('content');
  const spacer = document.getElementById('virtSpacer');
  if (!el || !spacer || currentView !== 'list') return;

  const total = listItems.length;
  spacer.style.height = (total * ITEM_H) + 'px';

  const headerH = (document.getElementById('listHeader')?.offsetHeight || 0) + 12;
  const scroll = Math.max(0, el.scrollTop - headerH);
  let start = Math.floor(scroll / ITEM_H) - VIRT_BUFFER;
  let end = Math.ceil((scroll + el.clientHeight) / ITEM_H) + VIRT_BUFFER;
  if (start < 0) start = 0;
  if (end > total) end = total;

  let html = '';
  for (let i = start; i < end; i++) {
    html += cardHtml(listItems[i], i);
  }
  spacer.innerHTML = html;
}

function cardHtml(d, i) {
  if (!d) return '';
  const snippet = highlightSnippet(d.snippet || '', searchQuery);
  const tagsHtml = (d.tags || []).map(t => `<span class="tag">#${escapeHtml(t)}</span>`).join('');
  const folderName = foldersById.get(d.folderId)?.name || '';
  return `
    <div class="doc-card virt" style="top:${i * ITEM_H}px" onclick="openDoc(${d.id})">
      <div class="title">${escapeHtml(d.title || 'Sem título')}</div>
      <div class="snippet">${snippet}</div>
      <div class="meta">
        ${folderName ? `<span>📂 ${escapeHtml(folderName)}</span>` : ''}
        ${tagsHtml}
        <span>${formatDate(d.updatedAt)}</span>
        ${d._score ? `<span class="score">${d._score.toFixed(2)}</span>` : ''}
      </div>
    </div>`;
}

function highlightSnippet(plain, query) {
  if (!plain) return '';
  const shown = plain.length > 180 ? plain.slice(0, 180) + '…' : plain;
  if (!query || !query.trim()) return escapeHtml(shown);
  const tokens = tokenize(query.replace(/"/g, ' '));
  let html = escapeHtml(shown);
  tokens.forEach(t => {
    if (t.length < 2) return;
    const re = new RegExp(`(${escapeRegExp(t)})`, 'gi');
    html = html.replace(re, '<mark>$1</mark>');
  });
  return html;
}

async function runGlobalSearch() {
  const gen = ++searchGen;
  const q = searchQuery.trim();
  if (!q) {
    searchResults = null;
    if (currentView === 'list') renderContent();
    return;
  }

  const phrases = [...normalize(q).matchAll(/"([^"]+)"/g)].map(m => m[1]).filter(Boolean);
  const qTokens = [...new Set(tokenize(q.replace(/"/g, ' ')))];
  const scoreMap = new Map();

  for (const tok of qTokens) {
    const posting = await dbGet('postings', tok);
    if (gen !== searchGen) return;
    bm25Add(scoreMap, tok, posting);
  }

  for (const [id, sc] of scoreMap) {
    const m = metaById.get(id);
    if (!m) continue;
    const titleToks = new Set(tokenize(m.title || ''));
    let boost = 1;
    qTokens.forEach(t => { if (titleToks.has(t)) boost *= 1.35; });
    const blob = normalize((m.title || '') + ' ' + (m.snippet || ''));
    phrases.forEach(ph => { if (blob.includes(ph)) boost *= 2.2; });
    scoreMap.set(id, sc * boost);
  }

  if (gen !== searchGen) return;

  searchResults = [...scoreMap.entries()]
    .filter(([, s]) => s > 0)
    .sort((a, b) => b[1] - a[1])
    .slice(0, SEARCH_CAP)
    .map(([id, score]) => ({ ...metaById.get(id), _score: score }))
    .filter(Boolean);

  listScrollTop = 0;
  if (currentView === 'list') renderContent();
}

// Internal find state
let findMatches = [];
let findIndex = -1;
let findQuery = '';

      </div>

        <select id="editFolder">
          <option value="">Sem pasta</option>

        </select>

        <button type="button" class="btn btn-ghost btn-sm" onmousedown="event.preventDefault()" onclick="findPrev()" title="Anterior">↑</button>
        <button type="button" class="btn btn-ghost btn-sm" onmousedown="event.preventDefault()" onclick="findNext()" title="Próximo">↓</button>
        <button type="button" class="btn btn-ghost btn-sm" onmousedown="event.preventDefault()" onclick="clearFind()" title="Limpar">✕</button>
      </div>

      <div class="editor-wrap" id="editorWrap">
        <div class="find-overlay" id="findOverlay"></div>
        <textarea class="content-area" id="editContent" placeholder="Cole ou digite o texto aqui..." onscroll="syncFindOverlayScroll()" oninput="if (findQuery) runFind()">${escapeHtml(d.content || '')}</textarea>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="backToList()" style="margin-top: 15px;">← Voltar</button>
    </div>`;

  findMatches = [];

}

/* ---------- Find inside note ---------- */
function runFind() {
  const input = document.getElementById('findInput');
  const ta = document.getElementById('editContent');
  if (!input || !ta) return;

  const q = input.value;
  findQuery = q;
  findMatches = [];
  findIndex = -1;

  if (!q) {
    updateFindCount();
    clearFindOverlay();
    return;
  }

  const text = ta.value;
  const lowerText = text.toLowerCase();
  const lowerQ = q.toLowerCase();
  let pos = 0;

  while ((pos = lowerText.indexOf(lowerQ, pos)) !== -1) {
    findMatches.push({ start: pos, end: pos + q.length });
    pos += Math.max(q.length, 1);
  }

  if (findMatches.length > 0) findIndex = 0;
  updateFindCount();
  renderFindOverlay(true);
}

function updateFindCount() {
  const el = document.getElementById('findCount');
  if (!el) return;
  if (findMatches.length === 0) {
    el.textContent = '0 / 0';
    el.style.color = 'var(--text2)';
  } else {
    el.textContent = `${findIndex + 1} / ${findMatches.length}`;
    el.style.color = 'var(--success)';
  }
}

function syncOverlayStyles() {
  const ta = document.getElementById('editContent');
  const overlay = document.getElementById('findOverlay');
  if (!ta || !overlay) return;
  const s = getComputedStyle(ta);
  overlay.style.padding = s.padding;
  overlay.style.font = s.font;
  overlay.style.lineHeight = s.lineHeight;
  overlay.style.letterSpacing = s.letterSpacing;
  overlay.style.wordSpacing = s.wordSpacing;
  overlay.style.tabSize = s.tabSize;
  overlay.style.borderWidth = s.borderWidth;
  overlay.style.borderStyle = 'solid';
  overlay.style.borderColor = 'transparent';
  overlay.style.boxSizing = s.boxSizing;
}

function renderFindOverlay(centerCurrent) {
  const ta = document.getElementById('editContent');
  const overlay = document.getElementById('findOverlay');
  const wrap = document.getElementById('editorWrap');
  if (!ta || !overlay || !wrap) return;

  if (!findQuery || findMatches.length === 0) {
    clearFindOverlay();
    return;
  }

  wrap.classList.add('find-active');
  syncOverlayStyles();

  const text = ta.value;
  let html = '';
  let last = 0;
  findMatches.forEach((m, i) => {
    html += escapeHtml(text.slice(last, m.start));
    const cls = i === findIndex ? 'find-current' : 'find-other';
    html += `<mark class="${cls}" data-find="${i}">${escapeHtml(text.slice(m.start, m.end))}</mark>`;
    last = m.end;
  });
  html += escapeHtml(text.slice(last));
  overlay.innerHTML = html;
  overlay.scrollTop = ta.scrollTop;

  if (centerCurrent && findIndex >= 0) {
    const mark = overlay.querySelector(`mark[data-find="${findIndex}"]`);
    if (mark) {
      const target = mark.offsetTop - (overlay.clientHeight / 2) + (mark.offsetHeight / 2);
      overlay.scrollTop = Math.max(0, target);
      ta.scrollTop = overlay.scrollTop;
    }
  }
}

function clearFindOverlay() {
  const wrap = document.getElementById('editorWrap');
  const overlay = document.getElementById('findOverlay');
  if (wrap) wrap.classList.remove('find-active');
  if (overlay) overlay.innerHTML = '';
}

function syncFindOverlayScroll() {
  const ta = document.getElementById('editContent');
  const overlay = document.getElementById('findOverlay');
  if (ta && overlay) overlay.scrollTop = ta.scrollTop;
}

function findNext() {
  if (!findQuery) return;
  if (findMatches.length === 0) {
    runFind();
    return;
  }
  findIndex = (findIndex + 1) % findMatches.length;
  updateFindCount();
  renderFindOverlay(true);
}

function findPrev() {
  if (!findQuery) return;
  if (findMatches.length === 0) {
    runFind();
    return;
  }
  findIndex = (findIndex - 1 + findMatches.length) % findMatches.length;
  updateFindCount();
  renderFindOverlay(true);
}

function clearFind() {
  const input = document.getElementById('findInput');
  if (input) {
    input.value = '';
    input.focus();
  }
  findMatches = [];
  findIndex = -1;
  findQuery = '';
  updateFindCount();
  clearFindOverlay();
}

function findKeydown(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (e.shiftKey) findPrev();
    else findNext();
  }
  if (e.key === 'Escape') {
    e.preventDefault();
    clearFind();
  }
}

  if (!searchQuery.trim()) renderContent();
}

function selectTag(tag) {
  currentTag = tag;
  currentFolderId = null;
  currentView = 'list';
  editingDoc = null;
  listScrollTop = 0;
  if (searchQuery.trim()) runGlobalSearch();
  closeSidebar();
  renderSidebar();
  if (!searchQuery.trim()) renderContent();
}

function newDoc() {
  editingDoc = {
    title: '',
    content: '',
    tags: [],
    folderId: currentFolderId || null,
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
  currentView = 'edit';
  closeSidebar();
  renderContent();
}

async function openDoc(id) {
  closeSidebar();
  const full = await dbGet('docs', id);
  if (!full) {
    toast('Texto não encontrado');
    return;
  }
  editingDoc = full;
  currentView = 'edit';
  renderContent();
}

function backToList() {
  currentView = 'list';
  editingDoc = null;
  renderContent();
}

async function saveDoc() {
  const title = document.getElementById('editTitle').value.trim();
  const content = document.getElementById('editContent').value;
  const folderVal = document.getElementById('editFolder').value;
  const folderId = folderVal ? parseInt(folderVal) : null;

  editingDoc.title = title || 'Sem título';
  editingDoc.content = content;
  editingDoc.folderId = folderId;
  editingDoc.updatedAt = Date.now();
  if (!editingDoc.createdAt) editingDoc.createdAt = Date.now();
  if (!editingDoc.tags) editingDoc.tags = [];

  const id = await dbPut('docs', editingDoc);
  editingDoc.id = id;
  const meta = toMeta(editingDoc);
  await dbPut('meta', meta);
  await reindexDoc(id, indexText(editingDoc), false);
  upsertMetaMemory(meta);
  toast('Texto salvo!');
  currentView = 'list';
  editingDoc = null;
  renderSidebar();
  if (searchQuery.trim()) runGlobalSearch();
  else renderContent();
}

async function deleteDoc(id) {
  if (!confirm('Excluir este texto permanentemente?')) return;
  await reindexDoc(id, '', true);
  await dbDelete('docs', id);
  await dbDelete('meta', id);
  removeMetaMemory(id);
  toast('Texto excluído');
  currentView = 'list';
  editingDoc = null;
  renderSidebar();
  if (searchQuery.trim()) runGlobalSearch();
  else renderContent();
}

function handleTagKey(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    const input = document.getElementById('tagInput');
    const tag = input.value.trim().toLowerCase();
    if (tag && !editingDoc.tags.includes(tag)) {
      editingDoc.tags.push(tag);
      input.value = '';
      renderEditor(document.getElementById('content'));
      document.getElementById('tagInput').focus();
    }
  }
}

function removeTag(tag) {
  editingDoc.tags = editingDoc.tags.filter(t => t !== tag);
  renderEditor(document.getElementById('content'));
}

function openModal(type) {
  const modal = document.getElementById('modal');
  const title = document.getElementById('modalTitle');
  const input = document.getElementById('modalInput');
  const confirmBtn = document.getElementById('modalConfirm');

  if (type === 'folder') {
    title.textContent = 'Nova Pasta';
    input.placeholder = 'Nome da pasta';
    input.value = '';
    confirmBtn.onclick = async () => {
      const name = input.value.trim();
      if (!name) return;
      const id = await dbPut('folders', { name, createdAt: Date.now() });
      folders.push({ id, name, createdAt: Date.now() });
      foldersById.set(id, { id, name });
      closeModal();
      toast('Pasta criada');
      renderSidebar();
    };
  }
  modal.classList.add('show');
  setTimeout(() => input.focus(), 50);
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

async function deleteFolder(id) {
  if (!confirm('Excluir pasta? Os textos dentro ficarão sem pasta.')) return;

  await new Promise((resolve, reject) => {
    const tx = db.transaction(['docs', 'meta', 'folders'], 'readwrite');
    const docsStore = tx.objectStore('docs');
    const metaStore = tx.objectStore('meta');
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
    metaStore.openCursor().onsuccess = e => {
      const c = e.target.result;
      if (!c) return;
      if (c.value.folderId === id) {
        const v = c.value;
        v.folderId = null;
        c.update(v);
        const g = docsStore.get(v.id);
        g.onsuccess = () => {
          const d = g.result;
          if (d) { d.folderId = null; docsStore.put(d); }
        };
      }
      c.continue();
    };
    tx.objectStore('folders').delete(id);
  });

  for (const m of metaById.values()) {
    if (m.folderId === id) m.folderId = null;
  }
  folders = folders.filter(f => f.id !== id);
  if (currentFolderId === id) currentFolderId = null;
  rebuildMemoryIndexes();
  toast('Pasta excluída');
  renderSidebar();
  renderContent();
}

/* ---------- Search ---------- */
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  currentView = 'list';
  editingDoc = null;
  clearTimeout(searchTimer);
  if (!searchQuery.trim()) {
    searchResults = null;
    renderContent();
    return;
  }
  searchTimer = setTimeout(() => runGlobalSearch(), 180);
});

function clearSearch() {
  searchQuery = '';
  searchResults = null;
  document.getElementById('searchInput').value = '';
  currentTag = null;
  currentFolderId = null;
  listScrollTop = 0;
  closeSidebar();
  renderSidebar();
  renderContent();
}

function toggleAdv() {
  advOpen = !advOpen;
  toast(advOpen
    ? 'Dica: use "frase exata" entre aspas • combine palavras • use tags e pastas'
    : 'Painel avançado fechado');
}

/* ---------- Export / Import ---------- */
async function exportData() {
  toast('Preparando backup...');
  const docs = [];
  const keys = await dbGetAllKeys('docs');
  for (let i = 0; i < keys.length; i++) {
    const d = await dbGet('docs', keys[i]);
    if (d) docs.push(d);
    if (i % 50 === 0) await yieldToUI();
  }
  const data = {
    version: 2,
    exportedAt: new Date().toISOString(),
    folders,
    docs
  };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `busca-offline-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Backup exportado!');
}

async function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  try {
    setBoot('Importando...');
    document.getElementById('bootOverlay').classList.remove('hide');
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data.docs || !Array.isArray(data.docs)) throw new Error('Formato inválido');

    await dbClear('docs');
    await dbClear('meta');
    await dbClear('folders');
    await dbClear('postings');
    await dbClear('docTokens');
    await dbClear('stats');
    stats = { id: 'global', N: 0, totalLen: 0 };
    metaById = new Map();

    for (const f of (data.folders || [])) {
      const { id, ...rest } = f;
      await dbPut('folders', rest);
    }
    folders = await dbGetAll('folders');
    const nameToId = {};
    folders.forEach(f => { nameToId[f.name] = f.id; });

    for (let i = 0; i < data.docs.length; i++) {
      const d = data.docs[i];
      const rest = { ...d };
      delete rest.id;
      if (rest.folderId && data.folders) {
        const oldFolder = data.folders.find(f => f.id === rest.folderId);
        rest.folderId = oldFolder ? (nameToId[oldFolder.name] || null) : null;
      }
      const newId = await dbPut('docs', rest);
      rest.id = newId;
      const meta = toMeta(rest);
      await dbPut('meta', meta);
      await reindexDoc(newId, indexText(rest), false);
      metaById.set(newId, meta);
      if (i % 10 === 0) {
        setBoot(`Importando ${i + 1} / ${data.docs.length}`);
        await yieldToUI();
      }
    }
    await dbPut('stats', stats);
    rebuildMemoryIndexes();
    hideBoot();
    renderSidebar();
    renderContent();
    toast(`Importado: ${data.docs.length} textos`);
  } catch (err) {
    hideBoot();
    toast('Erro ao importar: ' + err.message);
  }
  e.target.value = '';
}

/* ---------- Helpers ---------- */
function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&')
    .replace(/</g, '<')
    .replace(/>/g, '>')
    .replace(/"/g, '"');
}

function formatDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' });
}

function escapeRegExp(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- Init ---------- */
(async () => {
  try {
    await openDB();
    await boot();
  } catch (err) {
    console.error(err);
    setBoot('Erro ao abrir banco');
    document.getElementById('content').innerHTML = `<div class="empty-state"><h2>Erro ao abrir banco</h2><p>${escapeHtml(err.message)}</p></div>`;
  }
})();
</script>
